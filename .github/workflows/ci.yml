name: Questboard CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: questboard/backend/requirements*.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: questboard/frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: questboard/frontend
      - run: python -m pip install -r backend/requirements-test.txt
        working-directory: questboard
      - run: QUESTBOARD_TEST_FRONTEND_DIST="$PWD/frontend/dist" python -m pytest backend
        working-directory: questboard

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: questboard/frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: questboard/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  addon-config:
    name: Home Assistant app configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: frenck/action-addon-linter@d51677290aef26cdfc835271dd3c7343ce502809 # v2.21.2
        with:
          path: ./questboard

  addon-arm64:
    name: Add-on ARM64 image and persistence
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build ARM64 add-on image
        run: docker build --platform linux/arm64 -t questboard-ci ./questboard
      - run: python -m pip install -r backend/requirements-test.txt
        working-directory: questboard
      - name: Verify ingress and durable storage in ARM64 container
        run: python -m pytest backend/tests/test_addon_container.py -q
        working-directory: questboard
        env:
          QUESTBOARD_TEST_IMAGE: questboard-ci
          QUESTBOARD_TEST_IMAGE_PLATFORM: linux/arm64
